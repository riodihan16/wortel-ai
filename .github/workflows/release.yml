name: Release

# Tags like v0.1.0 trigger a Windows release build. Signing via the SignPath
# Foundation is gated behind a manual approval (environment "release") and
# stays off until the SignPath organization/project exist and the secrets are
# set. Without signing, the workflow still publishes the unsigned portable exe.
#
# Setup steps (once):
#   1. Apply to SignPath Foundation for open-source signing.
#   2. In SignPath, create an organization, a project, and a signing policy.
#   3. Add repo secrets: SIGNPATH_API_TOKEN, SIGNPATH_ORGANIZATION_ID,
#      SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG,
#      SIGNPATH_ARTIFACT_CONFIGURATION_SLUG.
#   4. Create the GitHub Environment "release" (optionally with reviewers).
#   5. Install the SignPath GitHub App for the repository.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "1.26.4"
  NODE_VERSION: "22"
  WAILS_VERSION: "v2.16.0"

jobs:
  build:
    name: Build unsigned exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            $v = "0.0.0-dev"
          }
          "value=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build
        run: wails build -ldflags "-X main.Version=${{ steps.version.outputs.value }}"

      - name: Upload unsigned artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: companion-unsigned
          path: build/bin/companion.exe
          if-no-files-found: error
          # SignPath requires the raw file, not a ZIP-wrapped artifact.
          archive: false

  sign:
    name: Sign with SignPath
    runs-on: windows-latest
    needs: [build]
    # Manual gate; also skipped automatically when the token is not configured.
    environment: release
    if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: companion-unsigned
          path: unsigned

      - name: Upload artifact for SignPath
        id: upload-for-signing
        uses: actions/upload-artifact@v4
        with:
          name: companion-for-signing
          path: unsigned/companion.exe
          if-no-files-found: error
          archive: false

      - name: Submit signing request
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ secrets.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-for-signing.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
          skip-decompress: true

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: companion-signed
          path: signed/companion.exe
          if-no-files-found: error
          archive: false

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [build, sign]
    # Publish signed if available, otherwise the unsigned build.
    if: ${{ always() && needs.build.result == 'success' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.sign.result == 'success' && 'companion-signed' || 'companion-unsigned' }}
          path: dist

      - name: Compute SHA-256
        id: hash
        run: |
          cd dist
          sha256sum companion.exe | tee ../SHA256SUMS.txt
          echo "value=$(cut -d' ' -f1 SHA256SUMS.txt)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/companion.exe
            SHA256SUMS.txt
          draft: true
          generate_release_notes: true
          body: |
            Wortel AI portable build.

            - File: `companion.exe` (Windows 10/11 x64), SHA-256 `${{ steps.hash.outputs.value }}`
            - Jalankan tanpa installer. Bila Windows SmartScreen menampilkan peringatan, pilih **More info → Run anyway**.
            - Data pengguna: `%LOCALAPPDATA%\WortelAI\` (lihat README untuk cara uninstall).
